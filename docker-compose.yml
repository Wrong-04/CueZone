services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cuezone-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    networks:
      - cuezone-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=/api/v1
        - VITE_SOCKET_URL=/
    container_name: cuezone-frontend
    restart: unless-stopped
    ports:
      - "5556:80"
    depends_on:
      - backend
    networks:
      - cuezone-network

networks:
  cuezone-network:
    driver: bridge
